services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coaching
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coaching_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coaching"]
      interval: 5s
      timeout: 5s
      retries: 10

  llm-router:
    image: decolua/9router:latest
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:20128:20128"
      # Codex OAuth callback
      - "127.0.0.1:1455:1455"
    volumes:
      - 9router_data:/app/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/coaching
      LLM_PROVIDER: 9router
      LLM_BASE_URL: http://llm-router:20128/v1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      llm-router:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  coaching_postgres_data:
  9router_data:
