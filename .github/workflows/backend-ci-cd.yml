name: Backend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "evals/**"
      - "alembic.ini"
      - "pyproject.toml"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "evals/**"
      - "alembic.ini"
      - "pyproject.toml"
      - ".github/workflows/backend-ci-cd.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Run backend tests
        run: python -m pytest

  backend-evals:
    name: DB-free eval suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install eval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Run deterministic eval suite
        run: python -m evals.run

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

  codeql:
    name: SAST (CodeQL Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze and upload SARIF
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:python
          output: codeql-results
          upload: false
      - name: Upload CodeQL SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: codeql-results
          category: codeql-backend
      - name: Fail on HIGH or CRITICAL CodeQL alerts
        run: |
          sarif_file="$(find codeql-results -type f -name '*.sarif' -print -quit)"
          test -n "$sarif_file" || { echo "CodeQL did not produce a SARIF file."; exit 1; }
          # CodeQL security-severity bands define HIGH/CRITICAL as 7.0 and above.
          high_critical_count="$(jq '[.runs[] as $run | $run.results[] as $result | ($run.tool.driver.rules[$result.ruleIndex].properties["security-severity"] // "0" | tonumber) | select(. >= 7)] | length' "$sarif_file")"
          test "$high_critical_count" -eq 0 || { echo "CodeQL found $high_critical_count HIGH/CRITICAL finding(s)."; exit 1; }

  trivy:
    name: Dependency and config scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-backend
      - name: Fail on HIGH or CRITICAL Trivy findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  deploy:
    name: Deploy backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, backend-evals, gitleaks, codeql, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    permissions: {}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy
        # The hook URL is copied from the backend service's Render Dashboard settings
        # and stored as a production-environment GitHub Actions secret.
        run: curl --fail --show-error --silent --retry 3 --retry-all-errors --data "" "$RENDER_DEPLOY_HOOK_URL"
      - name: Publish pipeline summary
        run: |
          {
            echo "## Backend deployment triggered"
            echo
            echo "Render received the deploy-hook request after all CI and security gates passed."
            echo
            echo "> Follow-up: the backend has no configured linter or formatter. This is intentionally deferred as a code-quality decision."
          } >> "$GITHUB_STEP_SUMMARY"
