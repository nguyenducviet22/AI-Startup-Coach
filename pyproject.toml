[project]
name = "coaching-harness"
version = "0.1.0"
description = "Backend harness for the AI Startup Coach product."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "fastapi>=0.112.0",
    "openai>=1.40.0",
    "pwdlib[argon2]>=0.2.1",
    "PyJWT>=2.9.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.2",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.12.0",
    "testcontainers[postgres]>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--basetemp=.tmp/pytest-basetemp"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["alembic/versions", "app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
